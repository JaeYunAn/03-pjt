<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ThRead - AI recommendation</title>

    <!-- Bootstrap 5.3.3 (명세 필수) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <!-- 서체: Pretendard(UI), Hahmlet(제목과 읽는 글). 둘 다 OFL 라이선스 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/hahmlet@5.2.5/index.css" />

    <!-- 06-main.html과 같은 디자인 시스템을 그대로 사용
         - common.css: 폰트 정의(@font-face), 색, 버튼, Navbar, 책 표지, 페이지네이션 등 공통 스타일
         - 06-main.css: 메인 페이지 각 섹션 스타일 (이 파일의 AI 추천(F304) 스타일 포함) -->
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="06-main.css" />
  </head>
  <body>
    <!--
      F304 AI Recommendation: 폭 80% 중앙 정렬, Grid 7:5(col-md-7 / col-md-5), 수직 중앙 정렬, "활동 데이터 기반" 강조(#fe4a51, SBAggroOTF_L, 1.3rem)
      최종 결합본: 06-main.html (F307)
    -->
    <main>
      <!-- ===================== F304 AI Recommendation ===================== -->
      <section class="page-section" id="ai-recommend" aria-labelledby="ai-title">
        <div class="ai-recommendation">
          <div class="row align-items-center gy-5">
            <!-- 좌측 7 -->
            <div class="col-12 col-md-7">
              <div class="book-fan">
                <span class="book-cover fan-side"><img src="assets/ai_recommendation/img1.jpeg" alt="Bauhaus 표지" loading="lazy" decoding="async" /></span>
                <span class="book-cover fan-center"><img src="assets/ai_recommendation/img2.jpeg" alt="Mastering AI 표지" loading="lazy" decoding="async" /></span>
                <span class="book-cover fan-side"><img src="assets/ai_recommendation/img3.jpeg" alt="Design of the 20th Century 표지" loading="lazy" decoding="async" /></span>
              </div>
              <p class="reason-chip">
                <i class="bi bi-stars" aria-hidden="true"></i>
                건축과 디자인 책을 자주 담아서 추천했어요
              </p>
            </div>
            <!-- 우측 5 -->
            <div class="col-12 col-md-5">
              <h2 class="section-title" id="ai-title">AI 추천</h2>
              <p class="ai-statement">좋아한 책을 알려 주면<br />다음 책은 AI가 골라요</p>
              <p class="ai-desc">
                구매 목록, 감명 깊게 읽은 도서 등<br />
                사용자 <span class="ai-highlight">활동 데이터 기반</span> 인공지능 도서 추천
              </p>
              <a class="btn btn-thread" href="#">내 취향으로 추천받기</a>
            </div>
          </div>
        </div>
      </section>

    </main>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
