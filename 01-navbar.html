<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ThRead - Navbar & Hero</title>

    <!-- Bootstrap 5.3.3 (명세 필수) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <!-- 서체: Pretendard(UI), Hahmlet(제목과 읽는 글). 둘 다 OFL 라이선스 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/hahmlet@5.2.5/index.css" />

    <!-- 06-main.html과 같은 디자인 시스템을 그대로 사용
         - common.css: 폰트 정의(@font-face), 색, 버튼, Navbar, 책 표지, 페이지네이션 등 공통 스타일
         - 06-main.css: 메인 페이지 각 섹션 스타일 (이 파일의 Navbar(F301), Hero(F302) 스타일 포함) -->
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="06-main.css" />
    <style>
      /* 이 파일을 단독으로 열 때만 필요한 보정 */
      .hero-section {
        padding-bottom: 96px; /* 베스트셀러 카드가 겹치지 않으므로 아래 여백만 */
      }
    </style>
  </head>
  <body>
    <!--
      F301 Navbar: 로고(Th 흰색 / Read #fe4a51, GmarketSansTTFMedium), 메뉴(흰색 → hover #fe4a51, SBAggro_L), 투명 배경, 576px 미만 토글(navbar-expand-sm), absolute + z-index
      F302 Hero: 576px 미만에서 "AI 기반 도서 분석 및" 뒤 줄바꿈(<br class="d-sm-none">), ThRead 색상과 폰트
      최종 결합본: 06-main.html (F307)
    -->
    <!-- ===================== F301 Navbar ===================== -->
    <nav class="navbar navbar-expand-sm navbar-dark thread-navbar" aria-label="주 메뉴">
      <div class="container-fluid nav-inner">
        <a class="navbar-brand logo" href="#top">
          <span class="th">Th</span><span class="read">Read</span>
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNav"
          aria-controls="mainNav"
          aria-expanded="false"
          aria-label="메뉴 열기"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="06-main.html#popular-thread">쓰레드</a></li>
            <li class="nav-item"><a class="nav-link" href="#">도서 검색</a></li>
            <li class="nav-item"><a class="nav-link" href="#">마이 페이지</a></li>
            <li class="nav-item">
              <!-- F308: 로그아웃 확인 Modal 열기 -->
              <button
                type="button"
                class="nav-link"
                data-bs-toggle="modal"
                data-bs-target="#logoutModal"
              >
                로그아웃
              </button>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- ===================== F302 Hero ===================== -->
    <header class="hero-section" id="top">
      <img src="assets/nav/hero_image.jpg" alt="" class="hero-img" />
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <div class="hero-main">
        <!-- 명세: 576px 미만에서 "AI 기반 도서 분석 및" 뒤 줄바꿈 → <br class="d-sm-none"> -->
        <h1 class="hero-title">
          <span class="hero-line">AI 기반 도서 분석 및</span><br class="d-sm-none" />
          <span class="hero-line">창작 지원 통합 솔루션 서비스</span>
        </h1>
        <div class="hero-subtitle">
          <span class="th">Th</span><span class="read">Read</span>
        </div>
        <p class="hero-desc">읽은 책은 기록하고, 다음 책은 AI와 함께 고르세요.</p>
        <div class="hero-actions">
          <a class="btn btn-thread btn-lg" href="06-main.html#ai-recommend">AI 추천 보기</a>
          <a class="hero-link" href="06-main.html#popular-thread">쓰레드 둘러보기</a>
        </div>
        </div>

        <!-- 넷플릭스 Billboard처럼 첫 화면에서 책 한 권을 보여 줌 (992px 이상에서만) -->
        <aside class="hero-pick d-none d-lg-flex" aria-label="이번 주의 책">
          <a class="book-link hero-pick-cover" href="06-main.html#book-1" tabindex="-1" aria-hidden="true">
            <span class="book-cover"><img src="assets/bestsellers/img1.jpeg" alt="" /></span>
          </a>
          <div class="hero-pick-body">
            <p class="hero-pick-label">이번 주의 책</p>
            <p class="hero-pick-title">소년이 온다</p>
            <p class="hero-pick-author">한강 | 창비</p>
            <p class="hero-pick-desc">1980년 5월 광주, 열다섯 살 동호와 그해 5월을 함께 지난 사람들의 이야기.</p>
            <a class="hero-pick-link" href="06-main.html#book-1">자세히 보기</a>
          </div>
        </aside>
      </div>
    </header>


    <!-- ===================== F308 로그아웃 확인 Modal ===================== -->
    <div
      class="modal fade logout-modal"
      id="logoutModal"
      tabindex="-1"
      aria-labelledby="logoutTitle"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
          </div>
          <div class="modal-body">
            <h2 class="modal-title" id="logoutTitle">로그아웃할까요?</h2>
            <p class="modal-desc">담아 둔 책과 쓰던 쓰레드는<br />다시 로그인하면 그대로 있어요.</p>
            <div class="modal-actions">
              <button type="button" class="btn btn-quiet" data-bs-dismiss="modal">취소</button>
              <button type="button" class="btn btn-thread" data-bs-dismiss="modal">로그아웃</button>
            </div>
          </div>
        </div>
      </div>
    </div>


    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
