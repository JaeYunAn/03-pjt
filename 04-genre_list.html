<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ThRead - Genre</title>

    <!-- Bootstrap 5.3.3 (명세 필수) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <!-- 서체: Pretendard(UI), Hahmlet(제목과 읽는 글). 둘 다 OFL 라이선스 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/hahmlet@5.2.5/index.css" />

    <!-- 06-main.html과 같은 디자인 시스템을 그대로 사용
         - common.css: 폰트 정의(@font-face), 색, 버튼, Navbar, 책 표지, 페이지네이션 등 공통 스타일
         - 06-main.css: 메인 페이지 각 섹션 스타일 (이 파일의 장르 목록(F305, F310) 스타일 포함) -->
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="06-main.css" />
  </head>
  <body>
    <!--
      F305 Genre List: 폭 80% 중앙 정렬, Flexbox 4열, 이미지 부모 크기 채움 + 좌측 하단 장르명 오버레이, 고정 크기, 576px 미만 폭 100% 1열
      F310 (심화): "모자이크" 버튼을 고르면 CSS Grid(grid-template-columns, grid-auto-rows, gap, grid-area)로 크기가 다른 배치
      최종 결합본: 06-main.html (F307)
    -->
    <main>
      <!-- ===================== F305 Genre List (+F310 모자이크 보기) =====================
           기본 보기: F305 Flexbox 4열 / 모자이크 보기: F310 CSS Grid
           두 보기는 오른쪽 위 버튼(라디오)으로 바꾸며, 전환은 CSS(:has)만으로 처리 -->
      <section class="page-section genre-books" id="genre" aria-labelledby="genre-title">
        <div class="section-inner">
          <header class="section-head section-head-row">
            <div>
              <h2 class="section-title" id="genre-title">장르별 도서 목록</h2>
              <p class="section-desc">관심 있는 장르부터 둘러보세요</p>
            </div>
            <div class="view-toggle" role="group" aria-label="장르 보기 방식">
              <input type="radio" class="btn-check" name="genreView" id="genreViewBasic" autocomplete="off" checked />
              <label class="view-toggle-btn" for="genreViewBasic"><i class="bi bi-grid" aria-hidden="true"></i> 기본</label>
              <input type="radio" class="btn-check" name="genreView" id="genreViewMosaic" autocomplete="off" />
              <label class="view-toggle-btn" for="genreViewMosaic"><i class="bi bi-columns-gap" aria-hidden="true"></i> 모자이크</label>
            </div>
          </header>

          <div class="genre-grid flex-wrap">
            <a class="genre-item genre-romance" href="#"><img src="assets/genre/romance.jpg" alt="" loading="lazy" decoding="async" /><span class="genre-name">로맨스<span class="genre-count">2,184권</span></span></a>
            <a class="genre-item genre-travel" href="#"><img src="assets/genre/travel.jpg" alt="" loading="lazy" decoding="async" /><span class="genre-name">여행<span class="genre-count">846권</span></span></a>
            <a class="genre-item genre-philosophy" href="#"><img src="assets/genre/philosophy.jpg" alt="" loading="lazy" decoding="async" /><span class="genre-name">철학<span class="genre-count">1,032권</span></span></a>
            <a class="genre-item genre-art" href="#"><img src="assets/genre/art.jpg" alt="" loading="lazy" decoding="async" /><span class="genre-name">예술<span class="genre-count">918권</span></span></a>
            <a class="genre-item genre-health" href="#"><img src="assets/genre/health.jpg" alt="" loading="lazy" decoding="async" /><span class="genre-name">건강<span class="genre-count">655권</span></span></a>
            <a class="genre-item genre-history" href="#"><img src="assets/genre/history.jpg" alt="" loading="lazy" decoding="async" /><span class="genre-name">역사<span class="genre-count">1,427권</span></span></a>
            <a class="genre-item genre-economy" href="#"><img src="assets/genre/economy.jpg" alt="" loading="lazy" decoding="async" /><span class="genre-name">경제<span class="genre-count">1,210권</span></span></a>
            <a class="genre-item genre-science" href="#"><img src="assets/genre/natural_science.jpg" alt="" loading="lazy" decoding="async" /><span class="genre-name">자연과학<span class="genre-count">774권</span></span></a>
            <a class="genre-item genre-youth" href="#"><img src="assets/genre/youth.jpg" alt="" loading="lazy" decoding="async" /><span class="genre-name">청소년<span class="genre-count">592권</span></span></a>
            <a class="genre-item genre-baby" href="#"><img src="assets/genre/baby.jpg" alt="" loading="lazy" decoding="async" /><span class="genre-name">유아<span class="genre-count">483권</span></span></a>

            <!-- 마지막 줄을 채우는 안내 타일 -->
            <div class="genre-cta">
              <div>
                <p class="genre-cta-title">어떤 장르가 맞는지 모르겠다면</p>
                <p class="genre-cta-desc">좋아하는 책 세 권만 고르면 AI가 맞는 장르를 찾아 드려요.</p>
              </div>
              <a class="btn btn-thread" href="#">장르 추천받기</a>
            </div>
          </div>
        </div>
      </section>

    </main>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
